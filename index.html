<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var isExtNoise = function (msg, src, stack) {
          var s = (msg || '') + ' ' + (src || '') + ' ' + (stack || '');
          return (
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            s.indexOf('Failed to connect to MetaMask') !== -1
          );
        };
        window.addEventListener(
          'error',
          function (e) {
            if (isExtNoise(e.message, e.filename, e.error && e.error.stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e.reason;
            var msg = typeof r === 'string' ? r : r && r.message;
            var stack = r && typeof r === 'object' ? r.stack : '';
            if (isExtNoise(msg, '', stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipForge Local Studio — Universal AI Video Clipping Agent</title>
    <meta
      name="description"
      content="Local-first AI video clipping studio that automatically analyzes long-form videos, detects content categories, selects high-value highlights, and renders vertical 9:16 clips."
    />
    <meta property="og:title" content="ClipForge Local Studio — Universal AI Video Clipping Agent" />
    <meta
      property="og:description"
      content="Local-first AI video clipping studio that automatically analyzes long-form videos, detects content categories, selects high-value highlights, and renders vertical 9:16 clips."

      rel="stylesheet"
    />
  </head>
